name: Update sports data

# 5분마다 네이버 스포츠에서 오늘 경기·순위·소식을 모아 커밋합니다.
# GitHub Pages가 main 브랜치를 그대로 서빙하므로, 이 커밋이 곧 앱 갱신입니다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Naver Sports data
        run: python3 scripts/fetch_sports.py

      - name: Commit data
        run: |
          git config user.name "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 자동 갱신"
            git push
          fi
