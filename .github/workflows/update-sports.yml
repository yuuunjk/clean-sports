name: Update sports data & deploy

# 5분마다 네이버 스포츠 데이터를 모아 커밋하고, 그 결과를 GitHub Pages로 배포합니다.
# 처음 실행될 때 Pages가 꺼져 있으면 이 워크플로가 스스로 켭니다(configure-pages enablement).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "app-icon-*.png"
      - "scripts/**"
      - "setup/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Naver Sports data
        run: python3 scripts/fetch_sports.py

      - name: Commit data
        run: |
          git config user.name "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 자동 갱신"
            git push
          fi

  deploy:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages (필요하면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
